<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relURL }}" rel="home">
      <img src="{{ "logo.svg" | relURL }}" alt="" width="36" height="36">
      {{ site.Title }}
    </a>
    <nav class="site-nav" aria-label="Main">
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
