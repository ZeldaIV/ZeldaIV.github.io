<div class="meta">
  <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  · {{ .ReadingTime }} min read
  {{ with .GetTerms "tags" }}
  <span class="tags">{{ range . }}<a class="tag" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</span>
  {{ end }}
</div>
